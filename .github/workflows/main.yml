name: AMAN Permanent Live Test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_level:
        description: Choose the test level
        required: true
        default: quick
        type: choice
        options:
          - quick
          - standard
          - full
          - setup

permissions:
  contents: read

concurrency:
  group: aman-live-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AMAN_BASE_URL: https://amaniq1.netlify.app
      AMAN_OWNER_EMAIL: ${{ secrets.AMAN_OWNER_EMAIL }}
      AMAN_OWNER_PASSWORD: ${{ secrets.AMAN_OWNER_PASSWORD }}
      AMAN_TEST_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.test_level || 'quick' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate permanent tester
        run: node --check aman-live-test.mjs

      - name: Run AMAN test
        run: node aman-live-test.mjs "$AMAN_TEST_LEVEL"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aman-live-test-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
